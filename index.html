<style>
:root{--bg:#0a0a12;--card:#14141f;--line:#23233a;--txt:#e8e8f0;--dim:#9a9ab0;--accent:#7b6cff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(123,108,255,.18),transparent)}
main{width:100%;max-width:480px;padding:48px 20px 60px}
.avatar{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;display:block;object-fit:cover;border:3px solid var(--line)}
h1{text-align:center;font-size:1.7rem;letter-spacing:2px}
.tagline{text-align:center;color:var(--dim);font-size:.9rem;margin:6px 0 28px;font-style:italic}
.featured{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1c1c2e,#14141f);border:1px solid var(--accent);border-radius:16px;padding:12px 16px;margin-bottom:28px;text-decoration:none;color:var(--txt);transition:all .15s ease}
.featured:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(123,108,255,.25)}
.featured img{width:56px;height:56px;border-radius:8px;flex-shrink:0}
.featured .label{font-size:.7rem;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.featured .title{font-weight:700}
.section{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin:0 4px 10px}
.track{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;text-decoration:none;color:var(--txt);transition:all .15s ease}
.track:hover{border-color:var(--accent);background:#1a1a2b;transform:translateY(-2px)}
.track img{width:42px;height:42px;border-radius:6px;flex-shrink:0}
.track .name{font-weight:600;font-size:.95rem}
.track .play{margin-left:auto;color:var(--dim);font-size:.95rem}
.track:hover .play{color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-top:18px;text-decoration:none;color:var(--txt);font-weight:600;transition:all .15s ease}
.btn:hover{border-color:var(--accent);background:#1a1a2b;transform:translateY(-2px)}
.btn .ic{font-size:1.15rem}
footer{text-align:center;color:var(--dim);font-size:.75rem;margin-top:36px}
</style>
